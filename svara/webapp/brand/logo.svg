<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#b3283a"/>
      <stop offset="0.55" stop-color="#6a0f1c"/>
      <stop offset="1" stop-color="#22060b"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset="0.45" stop-color="#e7b75a"/>
      <stop offset="1" stop-color="#9c6d1f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ece4d4"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <g id="cardShape">
      <rect x="-82" y="-115" width="164" height="230" rx="18" fill="url(#card)" stroke="#d8cdb8" stroke-width="2"/>
    </g>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <!-- nozik naqsh -->
  <g opacity="0.07" fill="none" stroke="#fff" stroke-width="2">
    <circle cx="320" cy="320" r="300"/><circle cx="320" cy="320" r="270"/>
  </g>
  <circle cx="320" cy="320" r="292" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.9"/>

  <!-- kartalar yelpig'i -->
  <g filter="url(#sh)" font-family="Georgia, 'Times New Roman', serif" font-weight="700">
    <g transform="translate(232 300) rotate(-20)">
      <use href="#cardShape"/>
      <text x="-62" y="-62" font-size="58" fill="#c62828">7</text>
      <text x="-60" y="-14" font-size="40" fill="#c62828">♥</text>
      <text x="0" y="60" font-size="110" text-anchor="middle" fill="#c62828">♥</text>
    </g>
    <g transform="translate(408 300) rotate(20)">
      <use href="#cardShape"/>
      <text x="-62" y="-62" font-size="58" fill="#c62828">7</text>
      <text x="-60" y="-14" font-size="40" fill="#c62828">♦</text>
      <text x="0" y="60" font-size="110" text-anchor="middle" fill="#c62828">♦</text>
    </g>
    <g transform="translate(320 278)">
      <use href="#cardShape"/>
      <text x="-62" y="-62" font-size="58" fill="#1b1b1f">7</text>
      <text x="-60" y="-14" font-size="40" fill="#1b1b1f">♣</text>
      <text x="0" y="62" font-size="118" text-anchor="middle" fill="#1b1b1f">♣</text>
      <!-- joker yulduzi -->
      <path transform="translate(52 -78) scale(1.15)" d="M0,-18 L5.3,-5.6 18,-5.6 7.6,2.6 11.4,15.6 0,7.6 -11.4,15.6 -7.6,2.6 -18,-5.6 -5.3,-5.6 Z" fill="url(#gold)" stroke="#9c6d1f" stroke-width="1.5"/>
    </g>
  </g>

  <!-- yozuv lentasi -->
  <g filter="url(#sh)">
    <rect x="130" y="420" width="380" height="96" rx="48" fill="#14060a" stroke="url(#gold)" stroke-width="5"/>
    <text x="320" y="490" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="66" letter-spacing="10" text-anchor="middle" fill="url(#gold)">SVARA</text>
  </g>
</svg>
