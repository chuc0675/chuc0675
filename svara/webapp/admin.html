<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Svara Admin</title>
  <style>
    :root { --bg: #120709; --panel: #1f0d11; --line: #3a1a20; --text: #f4ece6; --muted: #b59a95; --gold: #e2b357; --red: #c8463d; --ok: #3fbf7f; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    header { position: sticky; top: 0; background: #1a0a0d; border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; z-index: 2; }
    header h1 { font-size: 16px; margin: 0; color: var(--gold); letter-spacing: 2px; }
    nav { display: flex; gap: 6px; flex-wrap: wrap; }
    nav button, .btn { background: #2b1217; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; }
    nav button.on { background: var(--gold); color: #2b1a05; border-color: var(--gold); }
    .btn.danger { background: var(--red); border-color: var(--red); }
    .btn.ok { background: var(--ok); border-color: var(--ok); color: #04210f; }
    main { padding: 16px; max-width: 1200px; margin: 0 auto; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
    .stat b { display: block; font-size: 22px; color: var(--gold); font-variant-numeric: tabular-nums; }
    .stat span { color: var(--muted); font-size: 12px; }
    .wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
    table { border-collapse: collapse; width: 100%; min-width: 600px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
    .muted { color: var(--muted); }
    .pill { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 11px; background: #2b1217; }
    .pill.red { background: var(--red); } .pill.ok { background: var(--ok); color: #04210f; }
    input { background: #2b1217; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 7px 10px; font: inherit; }
    #msg { padding: 20px; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>SVARA · ADMIN</h1>
    <nav id="tabs">
      <button data-t="overview" class="on">Umumiy</button>
      <button data-t="rooms">Stollar</button>
      <button data-t="games">O'yinlar</button>
      <button data-t="users">Foydalanuvchilar</button>
      <button data-t="reports">Shikoyatlar</button>
      <button data-t="audit">Audit</button>
    </nav>
    <button class="btn" id="refresh">↻ Yangilash</button>
  </header>
  <main id="main"><div id="msg">Yuklanmoqda…</div></main>
  <script src="admin.js"></script>
</body>
</html>
